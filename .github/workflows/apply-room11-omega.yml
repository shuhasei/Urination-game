name: Apply ROOM11 and Omega Flowey

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_room11_omega.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply ROOM11, profiles, final fairness and boss sequence
        run: python .github/scripts/apply_room11_omega.py

      - name: JavaScript syntax check
        run: node --check game.js

      - name: Verify requested features
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('game.js').read_text(encoding='utf-8')
          required = [
              'ROOM11_OMEGA_MODULE_V1',
              "state === 'sansGuide'",
              "state === 'guideChoice'",
              "state === 'omegaBattle'",
              'undertaleProfilesV2',
              'logoutCurrentProfile',
              "setScriptSoul('red', GravityDirection.DOWN, false);",
              "return isCompactBattleSoul() ? .58 : 1;",
              "const y = 138;",
              "const menuY = 158;",
              'その けついが みらいを ひらいた。'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing features: ' + ', '.join(missing))
          print('ROOM11/Omega verification passed.')
          PY

      - name: Commit generated files
        run: |
          if git diff --quiet -- game.js game-loader.js index.html; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js game-loader.js index.html
          git commit -m "Add ROOM11 guide, saved profiles, and Omega Flowey battle"
          git push
