name: Apply Sans ending and test mode

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sans-ending.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_sans_ending_test_mode.py
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Commit patched game
        run: |
          rm -f scripts/apply_sans_ending_test_mode.py
          rm -f .github/workflows/apply-sans-ending.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js scripts/apply_sans_ending_test_mode.py .github/workflows/apply-sans-ending.yml
          git commit -m "Add video-style Sans defeat and test invincibility"
          git push
