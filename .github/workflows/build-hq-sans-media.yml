name: Build embedded HQ Sans media

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_hq_sans_media.py'
      - '.github/workflows/build-hq-sans-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Build high-quality embedded GIFs
        run: python tools/build_hq_sans_media.py
      - name: Commit generated media
        run: |
          if git diff --quiet -- generated-hq-media-v17.js; then
            echo 'generated media is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated-hq-media-v17.js
          git commit -m 'Generate embedded HQ Sans media [skip ci]'
          git push
