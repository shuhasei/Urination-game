name: Publish completed Sans build

on:
  push:
    paths:
      - '.github/workflows/publish-completed-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate completed build
        shell: bash
        run: |
          set -euo pipefail
          cat assets/final-complete-v2/part_*.txt \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            | gzip --decompress > /tmp/completed-game.patch

          git apply --check /tmp/completed-game.patch
          git apply --whitespace=nowarn /tmp/completed-game.patch

          cat > game-loader.js <<'JS'
          (() => {
            'use strict';

            const GAME_URL = 'game.js?v=20260806-final4';
            const hint = document.getElementById('start-hint');

            if (hint) {
              hint.textContent = 'ゲームデータを読み込んでいます…';
              hint.classList.add('visible');
            }

            const script = document.createElement('script');
            script.src = GAME_URL;
            script.async = false;
            script.onload = () => {
              if (hint && hint.textContent === 'ゲームデータを読み込んでいます…') {
                hint.textContent = 'ENTER / Z / タップ';
              }
            };
            script.onerror = () => {
              console.error('game.js could not be loaded.');
              if (hint) {
                hint.textContent = 'ゲームデータを読み込めませんでした。ページを再読み込みしてください。';
                hint.classList.add('visible');
              }
            };
            document.body.appendChild(script);
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          text = text.replace('20260806-final3', '20260806-final4')
          path.write_text(text)
          PY

          test "$(sha256sum game.js | cut -d' ' -f1)" = "1bd7c9a00ecabf308901a4ed4038aa5f6f21ff0f94cb4c0b06e8471fabbe1bc7"
          node --check game.js
          node --check game-loader.js

          rm -rf \
            assets/final-complete-v2 \
            assets/final-complete \
            assets/final-build-v3 \
            assets/final-build-v4
          rm -f assets/final-game-v7.patch.gz.b64.part*
          rm -f .github/workflows/publish-completed-build.yml

      - name: Commit completed build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish completed Sans battle build'

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          git push origin HEAD:main
