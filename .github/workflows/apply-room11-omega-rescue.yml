name: Apply ROOM11 and Omega Flowey rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_room11_omega_rescue.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply resilient patch
        run: python .github/scripts/apply_room11_omega_rescue.py
      - name: Check JavaScript
        run: node --check game.js
      - name: Commit game update
        run: |
          if git diff --quiet -- game.js game-loader.js index.html; then
            echo "No changes generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js game-loader.js index.html
          git commit -m "Add ROOM11 guide, profiles, and Omega Flowey sequence"
          git push
