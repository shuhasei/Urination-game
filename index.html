<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOILET ARC - STAGE 20 REVERSE</title>
<style>
:root{--green:#59e52d;--dark:#101417;--paper:#edf3f5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a0c;color:#fff;font-family:Arial,"Noto Sans JP",sans-serif}body{display:grid;place-items:center;padding:12px}.app{width:min(1050px,100%)}.bar{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-weight:900}.actions{display:flex;gap:8px}button{border:2px solid #111;border-radius:9px;background:#f2f3f4;color:#111;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 3px #111}button:active{transform:translateY(2px);box-shadow:0 1px #111}.wrap{position:relative;overflow:hidden;border:4px solid #191c1f;background:#bfd0d9;box-shadow:0 14px 36px #0008}canvas{display:block;width:100%;height:auto;touch-action:none}.screen{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(155deg,#8fa9b7f5,#526672fa)}.screen[hidden]{display:none}.card{width:min(570px,95%);padding:26px;border:4px solid #101417;border-radius:18px;background:#eef4f6f5;color:#101417;text-align:center;box-shadow:10px 11px #0005}.kicker{font-size:.78rem;font-weight:900;letter-spacing:.2em;color:#43545d}.title{margin:5px 0 2px;font-size:clamp(2.8rem,9vw,6rem);line-height:.82;letter-spacing:-.07em;transform:rotate(-2deg);text-shadow:4px 5px #fff,7px 8px #182127}.sub{font-weight:800;color:#465760;margin:12px 0 22px}.play{min-width:190px;border-radius:999px;background:var(--green);font-size:1.4rem;padding:13px 22px;box-shadow:0 6px #247d15}.row{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:14px}.help{margin:18px auto 0;text-align:left;line-height:1.65;color:#34444d;font-size:.9rem}.stage-card{width:min(780px,96%);max-height:88%;overflow:auto;padding:20px;border:4px solid #111;background:#f0f5f7f8;color:#111;box-shadow:10px 11px #0005}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stage{min-height:58px;padding:5px;background:#fff}.stage.locked{background:#cbd2d6;color:#707980;cursor:not-allowed}.stage.current{background:var(--green)}.result h2{font-size:2rem;margin:0}.score{font-weight:900;margin:14px}.note{text-align:center;color:#b8c0c6;font-size:.82rem;margin:9px 0 0}@media(max-width:650px){body{padding:4px}.grid{grid-template-columns:repeat(4,1fr)}.actions button{font-size:.8rem;padding:7px}.help{font-size:.79rem}}
</style>
</head>
<body>
<main class="app">
<div class="bar"><div>TOILET ARC：STAGE 20 REVERSE</div><div class="actions"><button id="sound">音：ON</button><button id="home">タイトル</button></div></div>
<div class="wrap">
<canvas id="game" width="960" height="720" aria-label="ステージ20から天地が反転する便器狙いゲーム"></canvas>
<section id="title" class="screen"><div class="card"><div class="kicker">HAND-DRAWN PHYSICS GAME</div><h1 class="title">TOILET<br>ARC</h1><div class="sub">ステージ1〜19は通常。ステージ20から天地が反転します。</div><button id="play" class="play">PLAY</button><div class="row"><button id="select">ステージ選択</button><button id="how">遊び方</button></div><div id="help" class="help" hidden><b>1. 人物の上半身をドラッグ</b>して姿勢を調整。<br><b>2. 大きな矢印をドラッグ</b>して方向と勢いを決定。<br><b>3. 右上のGO!</b>で点状の流れを発射します。<br><b>ステージ20以降</b>は人物・便器・背景・重力が上下反転します。</div></div></section>
<section id="stages" class="screen" hidden><div class="stage-card"><h2>STAGE SELECT</h2><div id="stageGrid" class="grid"></div><div class="row"><button id="back">戻る</button></div></div></section>
<section id="result" class="screen" hidden><div class="card result"><h2 id="resultTitle">CLEAR!</h2><p id="resultText"></p><div id="resultScore" class="score"></div><div class="row"><button id="retry">もう一度</button><button id="next" class="play">次へ</button></div></div></section>
</div>
<p class="note">ステージ1〜19：通常重力／ステージ20〜24：天地逆転　・　SpaceでGO</p>
</main>
<script>
(()=>{"use strict";
const c=document.getElementById("game"),x=c.getContext("2d"),W=c.width,H=c.height,floor=585;
const screens={title:document.getElementById("title"),stages:document.getElementById("stages"),result:document.getElementById("result")};
const names=["Patience","Soft Start","Long Reach","High Arc","Low Pressure","Heavy Fall","Wide Spray","Steady Hands","Back Step","Tiny Target","Fast Drop","Calm Aim","Far Corner","High Pressure","Gentle Curve","Cold Morning","Narrow Bowl","Deep Focus","Late Night","Last Chance","Moon Gravity","Strong Spirit","Perfect Form","Final Arc"];
const levels=Array.from({length:24},(_,i)=>{const g=Math.floor(i/4);return{name:names[i],concentration:1+(i*2+g)%5,disposition:1+(i*3+1)%5,pressure:1+(i*4+2)%5,toiletX:670+((i%4)-1.5)*32+g*5,scale:Math.max(.72,1.04-g*.035),playerX:230-(i%3)*8,goal:12+g,hue:198+(i%5)*8,floorDark:i%3,lives:i<8?2:3}});
let idx=0,unlocked=Math.max(1,Math.min(levels.length,Number(localStorage.getItem("toiletArcUnlocked")||1))),level=levels[0],mode="menu",tilt=-25,angle=42,force=118,drag=null,drops=[],pending=0,timer=0,hits=0,misses=0,lives=2,delay=0,face="worried",soundOn=true,last=performance.now();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function isReverse(){return idx>=19}
function show(which){Object.entries(screens).forEach(([k,v])=>v.hidden=k!==which)}
function start(i){idx=clamp(i,0,levels.length-1);level=levels[idx];mode="aim";lives=level.lives;tilt=-25;angle=42;force=118;reset();show("none");face="worried"}
function reset(){drops=[];pending=0;timer=0;hits=0;misses=0;delay=0;if(mode!=="menu")mode="aim"}
function buildGrid(){const g=document.getElementById("stageGrid");g.innerHTML="";levels.forEach((lv,i)=>{const b=document.createElement("button");b.className="stage"+(i>=unlocked?" locked":"")+(i===idx?" current":"");b.disabled=i>=unlocked;b.innerHTML=`<b>${i+1}</b><br><small>${i<unlocked?(lv.name+(i>=19?" ↕":"")):"LOCK"}</small>`;b.onclick=()=>start(i);g.appendChild(b)})}
function player(){const hip={x:level.playerX+25,y:floor-82},r=tilt*Math.PI/180,shoulder={x:hip.x+Math.sin(r)*91,y:hip.y-Math.cos(r)*91},head={x:shoulder.x+Math.sin(r)*43,y:shoulder.y-Math.cos(r)*43},front={x:Math.cos(r),y:Math.sin(r)},origin={x:hip.x+front.x*25+5,y:hip.y+front.y*25-7};return{hip,shoulder,head,origin,r}}
function toilet(){const s=level.scale;return{x:level.toiletX,y:floor,s,bx:level.toiletX,by:floor-105*s,rx:55*s,ry:13*s}}
function arrow(){const p=player(),r=angle*Math.PI/180,start={x:p.origin.x+18,y:p.origin.y-25};return{start,end:{x:start.x+Math.cos(r)*force,y:start.y-Math.sin(r)*force},r}}
function screenPoint(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function point(e){const p=screenPoint(e);return isReverse()?{x:p.x,y:H-p.y}:p}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function seg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1);return Math.hypot(p.x-a.x-dx*t,p.y-a.y-dy*t)}
function down(e){if(mode!=="aim")return;const sp=screenPoint(e);if(dist(sp,{x:850,y:100})<=70){launch();return}const p=point(e),pg=player(),ag=arrow();if(dist(p,ag.end)<48||seg(p,ag.start,ag.end)<22)drag="arrow";else if(seg(p,pg.hip,pg.shoulder)<48||dist(p,pg.head)<48)drag="body";if(drag){c.setPointerCapture?.(e.pointerId);e.preventDefault()}}
function move(e){if(!drag||mode!=="aim")return;const p=point(e);if(drag==="body"){const h=player().hip;tilt=clamp(Math.atan2(p.x-h.x,h.y-p.y)*180/Math.PI,-58,38)}else{const s=arrow().start,dx=p.x-s.x,dy=p.y-s.y;angle=clamp(Math.atan2(-dy,dx)*180/Math.PI,-12,83);force=clamp(Math.hypot(dx,dy),70,172)}e.preventDefault()}
function up(e){drag=null;try{c.releasePointerCapture?.(e.pointerId)}catch{}}
function launch(){if(mode!=="aim")return;mode="shoot";hits=misses=0;drops=[];pending=34;timer=0;delay=0;face="focus";beep(540,.08)}
function spawn(i){const p=player(),spread=(Math.random()-.5)*level.pressure*1.7,r=(angle+spread)*Math.PI/180,s=force*.047*(.88+level.disposition*.065)*(.94+Math.random()*.12);drops.push({x:p.origin.x+Math.cos(r)*(i%3)*3,y:p.origin.y-Math.sin(r)*(i%3)*3,vx:Math.cos(r)*s,vy:-Math.sin(r)*s,r:4+Math.random()*1.5,alive:true,age:0})}
function update(dt){if(mode!=="shoot")return;const f=Math.min(2.2,dt/16.6667);timer-=f;if(pending>0&&timer<=0){spawn(34-pending);pending--;timer=3.1}const g=(.018+level.concentration*.0065)*f,t=toilet();for(const d of drops){if(!d.alive)continue;d.vy+=g;d.x+=d.vx*f;d.y+=d.vy*f;d.age+=f;const nx=(d.x-t.bx)/t.rx,ny=(d.y-t.by)/(t.ry+7);if(nx*nx+ny*ny<=1&&d.vy>0){d.alive=false;hits++;if(hits%5===0)beep(740,.025)}else if(d.y>=floor-2||d.x>W+25||d.x<-25||d.y<-40||d.age>390){d.alive=false;misses++}}const alive=drops.reduce((n,d)=>n+(d.alive?1:0),0);if(pending===0&&alive===0){delay+=f;if(delay>24)evaluate()}}
function evaluate(){if(hits>=level.goal){face="happy";mode="result";if(idx+2>unlocked){unlocked=Math.min(levels.length,idx+2);localStorage.setItem("toiletArcUnlocked",String(unlocked))}resultTitle.textContent="CLEAR!";resultText.textContent=isReverse()?"逆重力の軌道で、きれいに便器へ入りました。":"きれいに便器へ入りました。";resultScore.textContent=`命中 ${hits} / 34　・　必要 ${level.goal}`;next.hidden=false;show("result");sequence([620,780,940])}else{lives--;face="sad";mode="result";resultTitle.textContent=lives>0?"MISS...":"OUT OF LIVES";resultText.textContent=lives>0?"角度か勢いを少し変えてみよう。":"このステージを最初からやり直します。";resultScore.textContent=`命中 ${hits} / 34　・　必要 ${level.goal}`;next.hidden=true;show("result");beep(180,.18)}}
function beep(freq,dur){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext,ac=beep.ac||(beep.ac=new A),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.055,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch{}}
function sequence(a){a.forEach((n,i)=>setTimeout(()=>beep(n,.09),i*110))}
function room(){const grad=x.createLinearGradient(0,0,0,floor);grad.addColorStop(0,`hsl(${level.hue},28%,78%)`);grad.addColorStop(1,`hsl(${level.hue},25%,69%)`);x.fillStyle=grad;x.fillRect(0,0,W,floor);x.globalAlpha=.08;for(let i=0;i<160;i++){x.fillStyle=i%2?"#fff":"#17242c";x.fillRect((i*83)%W,(i*47)%floor,2,2)}x.globalAlpha=1;const fg=x.createLinearGradient(0,floor,0,H);fg.addColorStop(0,level.floorDark===1?"#d0d0ce":"#dededb");fg.addColorStop(1,level.floorDark===2?"#a7aaab":"#b8bbbc");x.fillStyle=fg;x.fillRect(0,floor,W,H-floor);x.strokeStyle="#5558";x.lineWidth=3;for(let y=floor;y<=H;y+=56){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}const vx=W*.52;for(let xx=-260;xx<W+300;xx+=105){x.beginPath();x.moveTo(xx,H);x.lineTo(vx+(xx-vx)*.35,floor);x.stroke()}x.strokeStyle="#fff9";x.lineWidth=4;x.beginPath();x.moveTo(0,floor);x.lineTo(W,floor);x.stroke()}
function stats(){x.fillStyle="#101316";x.font="31px Arial";x.textAlign="left";x.fillText(`Concentration: ${level.concentration}`,35,62);x.fillText(`Disposition: ${level.disposition}`,35,103);x.fillText(`Pressure: ${level.pressure}`,35,144);if(isReverse()){x.save();x.fillStyle="#101316";x.font="bold 22px Arial";x.textAlign="center";x.fillText("REVERSE GRAVITY - STAGE "+(idx+1),W/2,48);x.restore()}}
function character(){const p=player(),f1={x:level.playerX+6,y:floor-6},f2={x:level.playerX+58,y:floor-4},sx=Math.cos(p.r),sy=Math.sin(p.r);x.save();x.strokeStyle="#0d0f10";x.fillStyle="#f5f5f3";x.lineWidth=8;x.lineCap="round";x.lineJoin="round";x.beginPath();x.moveTo(p.hip.x-8,p.hip.y);x.lineTo(f1.x+9,f1.y-42);x.lineTo(f1.x+9,f1.y);x.lineTo(f1.x+35,f1.y);x.stroke();x.beginPath();x.moveTo(p.hip.x+9,p.hip.y);x.lineTo(f2.x-11,f2.y-43);x.lineTo(f2.x-11,f2.y);x.lineTo(f2.x+16,f2.y);x.stroke();x.beginPath();x.moveTo(p.hip.x-sx*14,p.hip.y-sy*14);x.lineTo(p.shoulder.x-sx*23,p.shoulder.y-sy*23);x.lineTo(p.shoulder.x+sx*18,p.shoulder.y+sy*18);x.lineTo(p.hip.x+sx*17,p.hip.y+sy*17);x.closePath();x.fill();x.stroke();x.beginPath();x.moveTo(p.shoulder.x+sx*8,p.shoulder.y+sy*8);x.lineTo(p.hip.x+30,p.hip.y-8);x.lineTo(p.origin.x+8,p.origin.y+4);x.stroke();x.beginPath();x.arc(p.head.x,p.head.y,30,0,Math.PI*2);x.fill();x.stroke();drawFace(p.head.x,p.head.y,p.r);if(mode==="aim"){x.globalAlpha=.14;x.fillStyle="#54e129";x.beginPath();x.arc(p.shoulder.x,p.shoulder.y,48,0,Math.PI*2);x.fill();x.globalAlpha=1}x.restore()}
function drawFace(px,py,r){x.save();x.translate(px,py);x.rotate(r);x.strokeStyle=x.fillStyle="#0b0d0e";x.lineWidth=5;x.lineCap="round";x.beginPath();x.moveTo(-14,-9);x.lineTo(-6,-13);x.moveTo(7,-13);x.lineTo(15,-8);x.stroke();x.beginPath();x.arc(-9,-2,3.5,0,Math.PI*2);x.arc(9,-2,3.5,0,Math.PI*2);x.fill();x.beginPath();if(face==="happy")x.arc(0,6,12,0,Math.PI);else if(face==="sad")x.arc(0,18,11,Math.PI,Math.PI*2);else if(face==="focus"){x.moveTo(-9,12);x.lineTo(9,12)}else x.arc(0,14,10,Math.PI,Math.PI*2);x.stroke();x.restore()}
function rr(px,py,w,h,r){x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()}
function drawToilet(){const t=toilet(),s=t.s;x.save();x.translate(t.x,t.y);x.scale(s,s);x.strokeStyle="#0c0f11";x.fillStyle="#f8f8f5";x.lineWidth=7/s;x.lineJoin="round";x.beginPath();rr(42,-184,73,101,9);x.fill();x.stroke();x.fillStyle="#d6dadb";x.beginPath();x.arc(91,-160,7,0,Math.PI*2);x.fill();x.stroke();x.fillStyle="#f8f8f5";x.beginPath();x.ellipse(0,-105,70,21,0,0,Math.PI*2);x.fill();x.stroke();x.fillStyle="#aab8c0";x.beginPath();x.ellipse(0,-105,53,11,0,0,Math.PI*2);x.fill();x.stroke();x.fillStyle="#f8f8f5";x.beginPath();x.moveTo(-47,-94);x.quadraticCurveTo(-40,-33,-23,-17);x.lineTo(-36,-3);x.lineTo(30,-3);x.quadraticCurveTo(52,-28,47,-93);x.closePath();x.fill();x.stroke();x.beginPath();x.moveTo(49,-97);x.quadraticCurveTo(82,-96,86,-126);x.stroke();x.restore()}
function aim(){if(mode!=="aim")return;const a=arrow(),head=24;x.save();x.strokeStyle="#8196a2";x.fillStyle="#ebf6facd";x.lineWidth=10;x.lineCap="round";x.lineJoin="round";x.beginPath();x.moveTo(a.start.x,a.start.y);x.lineTo(a.end.x,a.end.y);x.stroke();x.beginPath();x.moveTo(a.end.x,a.end.y);x.lineTo(a.end.x-Math.cos(a.r-.62)*head,a.end.y+Math.sin(a.r-.62)*head);x.lineTo(a.end.x-Math.cos(a.r)*13,a.end.y+Math.sin(a.r)*13);x.lineTo(a.end.x-Math.cos(a.r+.62)*head,a.end.y+Math.sin(a.r+.62)*head);x.closePath();x.fill();x.stroke();x.globalAlpha=.16;x.fillStyle="#55e225";x.beginPath();x.arc(a.end.x,a.end.y,42,0,Math.PI*2);x.fill();x.restore()}
function drawDrops(){x.save();x.fillStyle="#e7c735";x.strokeStyle="#9d7d04";x.lineWidth=1.2;for(const d of drops){if(!d.alive)continue;x.beginPath();x.arc(d.x,d.y,d.r,0,Math.PI*2);x.fill();x.stroke()}x.restore()}
function go(){x.save();x.translate(850,100);x.fillStyle=mode==="aim"?"#57e52c":"#7f9480";x.strokeStyle="#0d1011";x.lineWidth=8;x.beginPath();x.arc(0,0,64,0,Math.PI*2);x.fill();x.stroke();x.strokeStyle="#ffffff73";x.lineWidth=4;x.beginPath();x.arc(-5,-7,49,.55,4.4);x.stroke();x.fillStyle="#101312";x.font="bold 45px Arial";x.textAlign="center";x.textBaseline="middle";x.fillText("GO!",1,2);x.restore()}
function bottom(){x.fillStyle="#101316";x.font="29px Arial";x.textAlign="left";x.fillText(`Lives: ${lives}`,34,624);x.fillStyle="#050709d1";x.fillRect(22,642,W-44,60);x.strokeStyle="#ffffff29";x.lineWidth=2;x.strokeRect(22,642,W-44,60);x.fillStyle="#d8d8d8";x.font="bold 34px Arial";x.fillText(level.name,39,684);if(mode==="shoot"){x.textAlign="right";x.font="bold 26px Arial";x.fillText(`${hits} / ${level.goal}`,W-42,682);x.fillStyle="#55df2c";x.fillRect(W-260,651,210*Math.min(1,(hits+misses)/34),8)}}
function draw(){if(isReverse()){x.save();x.translate(0,H);x.scale(1,-1);room();character();drawToilet();aim();drawDrops();x.restore();stats();go();bottom()}else{room();stats();character();drawToilet();aim();drawDrops();go();bottom()}}
function frame(now){const dt=now-last;last=now;update(dt);draw();requestAnimationFrame(frame)}
play.onclick=()=>start(Math.min(idx,unlocked-1));select.onclick=()=>{buildGrid();show("stages")};back.onclick=()=>show("title");how.onclick=()=>help.hidden=!help.hidden;retry.onclick=()=>{if(lives<=0)lives=level.lives;reset();face="worried";show("none")};next.onclick=()=>start(idx<levels.length-1?idx+1:0);home.onclick=()=>{mode="menu";show("title")};sound.onclick=()=>{soundOn=!soundOn;sound.textContent=`音：${soundOn?"ON":"OFF"}`;if(soundOn)beep(500,.05)};
c.addEventListener("pointerdown",down);c.addEventListener("pointermove",move);c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
window.addEventListener("keydown",e=>{if(!screens.title.hidden||!screens.stages.hidden||!screens.result.hidden||mode!=="aim")return;let ok=true;switch(e.key){case"a":case"A":tilt=clamp(tilt-2,-58,38);break;case"d":case"D":tilt=clamp(tilt+2,-58,38);break;case"ArrowUp":angle=clamp(angle+(isReverse()?-2:2),-12,83);break;case"ArrowDown":angle=clamp(angle+(isReverse()?2:-2),-12,83);break;case"ArrowRight":force=clamp(force+4,70,172);break;case"ArrowLeft":force=clamp(force-4,70,172);break;case" ":case"Enter":launch();break;default:ok=false}if(ok)e.preventDefault()});
buildGrid();show("title");requestAnimationFrame(frame);
})();
</script>
</body>
</html>
