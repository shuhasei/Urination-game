<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>トイレ・ルートチャレンジ 100</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3eee3;
      --panel: #fffdf7;
      --ink: #252525;
      --muted: #746f66;
      --line: #ded5c7;
      --accent: #6b55d9;
      --accent-dark: #4f3caf;
      --accent-text: #fff;
      --yellow: #f4bf21;
      --good: #1f9b62;
      --bad: #d34b4b;
      --shadow: 0 16px 42px rgba(71, 57, 34, .15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      padding: 14px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.88), transparent 34rem),
        var(--page);
    }

    button, input { font: inherit; }

    button {
      min-height: 42px;
      padding: 9px 13px;
      color: var(--ink);
      font-weight: 800;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 13px;
      cursor: pointer;
    }

    button:hover:not(:disabled) { filter: brightness(.98); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: .45; }
    button:focus-visible { outline: 3px solid rgba(107,85,217,.3); outline-offset: 2px; }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4.5vw, 2rem);
      line-height: 1.05;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 9px;
    }

    .hud-item {
      min-width: 0;
      padding: 8px 7px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .hud-label {
      color: var(--muted);
      font-size: .72rem;
      white-space: nowrap;
    }

    .hud-value {
      margin-top: 1px;
      overflow: hidden;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-frame {
      position: relative;
      overflow: hidden;
      background: #fff8e8;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      user-select: none;
    }

    .message {
      min-height: 48px;
      margin-top: 10px;
      padding: 12px 14px;
      text-align: center;
      font-weight: 850;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .message.success { color: var(--good); }
    .message.fail { color: var(--bad); }

    .bottom-controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 9px;
    }

    .primary {
      color: var(--accent-text);
      background: var(--accent);
      border-color: var(--accent);
    }

    .primary:hover:not(:disabled) { background: var(--accent-dark); }

    .instructions {
      margin: 9px 2px 0;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.55;
      text-align: center;
    }

    dialog {
      width: min(700px, calc(100% - 24px));
      max-height: min(84vh, 820px);
      padding: 0;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    dialog::backdrop { background: rgba(25, 22, 30, .56); }

    .dialog-inner { padding: 16px; }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .dialog-head h2 { margin: 0; }

    .close {
      width: 42px;
      min-width: 42px;
      padding: 0;
      font-size: 1.3rem;
    }

    .stage-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      max-height: 65vh;
      overflow: auto;
      padding: 2px;
    }

    .stage-button {
      min-height: 72px;
      padding: 8px 4px;
      text-align: center;
    }

    .stage-button.current {
      color: var(--accent-text);
      background: var(--accent);
      border-color: var(--accent);
    }

    .stage-number { display: block; font-size: 1.05rem; }
    .stage-stars { display: block; margin-top: 3px; color: var(--yellow); font-size: .78rem; }
    .stage-button.current .stage-stars { color: #fff3a3; }

    .result {
      text-align: center;
    }

    .result-face {
      display: grid;
      width: 92px;
      height: 92px;
      margin: 4px auto 10px;
      place-items: center;
      font-size: 3.7rem;
      background: #fff4c7;
      border: 2px solid #e3c65e;
      border-radius: 50%;
    }

    .result h2 { margin: 4px 0; font-size: 1.7rem; }
    .big-stars { margin: 8px 0; color: var(--yellow); font-size: 2rem; letter-spacing: .12em; }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    @media (max-width: 610px) {
      body { padding: 8px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
      .hud { grid-template-columns: repeat(2, 1fr); }
      .stage-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 420px) {
      .stage-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .bottom-controls { grid-template-columns: 1fr 1fr; }
      .bottom-controls .primary { grid-column: 1 / -1; }
    }


    /* Opening screen inspired by the supplied reference image. */
    body.splash-open {
      overflow: hidden;
      padding: 0;
      background: #6d39d8;
    }

    body.splash-open .app {
      display: none;
    }

    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 50% 58%, rgba(255,255,255,.17), transparent 28%),
        repeating-conic-gradient(from -8deg at 50% 57%, rgba(255,255,255,.11) 0deg 14deg, transparent 14deg 29deg),
        linear-gradient(180deg, #8050ee 0%, #6b36d5 48%, #5428b9 100%);
      isolation: isolate;
    }

    .splash-screen[hidden] { display: none; }

    .splash-screen::before,
    .splash-screen::after {
      content: "";
      position: absolute;
      inset: -25%;
      z-index: -2;
      pointer-events: none;
    }

    .splash-screen::before {
      background:
        radial-gradient(circle at 8% 18%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 18% 70%, #fff 0 3px, transparent 4px),
        radial-gradient(circle at 37% 31%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 68% 22%, #fff 0 3px, transparent 4px),
        radial-gradient(circle at 87% 65%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 73% 81%, #fff 0 3px, transparent 4px),
        radial-gradient(circle at 24% 87%, #fff 0 2px, transparent 3px);
      opacity: .75;
      animation: sparkle-drift 11s linear infinite;
    }

    .splash-screen::after {
      background: radial-gradient(ellipse at 50% 110%, rgba(43,15,115,.6), transparent 48%);
      z-index: -1;
    }

    @keyframes sparkle-drift {
      to { transform: rotate(4deg) translateY(-18px); }
    }

    .splash-layout {
      position: relative;
      width: min(100vw, 520px);
      height: min(100vh, 940px);
      min-height: 620px;
      padding: max(16px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      align-items: center;
    }

    .splash-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 4;
    }

    .splash-icon-button,
    .no-ads-button,
    .splash-small-button,
    .splash-play-button {
      border: 0;
      box-shadow: 0 7px 0 rgba(48,21,119,.5), 0 10px 20px rgba(28,8,78,.28);
      -webkit-tap-highlight-color: transparent;
    }

    .splash-icon-button {
      width: 54px;
      min-width: 54px;
      height: 54px;
      min-height: 54px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(#b680ff, #7d42e9);
      border: 3px solid rgba(255,255,255,.45);
      border-radius: 16px;
      font-size: 1.7rem;
      text-shadow: 0 2px 0 #4b249d;
    }

    .no-ads-button {
      min-height: 54px;
      padding: 7px 15px 7px 11px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      background: linear-gradient(#ff9d39, #e95b17);
      border: 3px solid rgba(255,255,255,.45);
      border-radius: 16px;
      text-shadow: 0 2px 0 rgba(135,46,7,.75);
    }

    .no-ads-copy {
      display: grid;
      line-height: 1;
      text-align: left;
    }

    .no-ads-copy strong { font-size: 1.05rem; letter-spacing: .04em; }
    .no-ads-copy span { margin-top: 5px; font-size: .86rem; font-weight: 900; }

    .coin-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: #b46b05;
      background: radial-gradient(circle at 34% 30%, #fff7a7 0 13%, #ffd83f 14% 54%, #ef9d0a 55% 100%);
      border: 3px solid #fff2a2;
      border-radius: 50%;
      box-shadow: inset 0 -3px 0 rgba(145,75,0,.28);
      font-size: .9rem;
      text-shadow: none;
    }

    .splash-brand {
      position: relative;
      z-index: 3;
      margin-top: 12px;
      text-align: center;
      transform: rotate(-2deg);
    }

    .splash-title {
      margin: 0;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(3rem, 13vw, 5rem);
      line-height: .84;
      letter-spacing: -.055em;
      color: #ffc83d;
      -webkit-text-stroke: 8px #46208f;
      paint-order: stroke fill;
      text-shadow:
        0 7px 0 #7134c9,
        0 12px 0 #351577,
        0 17px 18px rgba(27,7,73,.45);
    }

    .splash-title .pee {
      display: inline-block;
      color: #fff;
      -webkit-text-stroke-color: #5b2cb0;
      transform: translateY(-2px) rotate(-3deg);
    }

    .splash-subtitle {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 18px 7px;
      color: #e78a20;
      background: #fff;
      border: 5px solid #5628a5;
      border-radius: 11px;
      box-shadow: 0 7px 0 #351576;
      font-family: "Arial Black", system-ui, sans-serif;
      font-size: clamp(.95rem, 4vw, 1.4rem);
      letter-spacing: .045em;
      line-height: 1;
      transform: rotate(1deg);
    }

    .hero-scene {
      position: relative;
      align-self: stretch;
      min-height: 330px;
      display: grid;
      place-items: center;
      z-index: 2;
    }

    .hero-character {
      position: absolute;
      top: 1%;
      left: 50%;
      width: min(91%, 430px);
      transform: translateX(-50%);
      filter: drop-shadow(0 14px 12px rgba(35,8,87,.3));
      animation: hero-bob 2.8s ease-in-out infinite;
    }

    @keyframes hero-bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(7px); }
    }

    .splash-toilet {
      position: absolute;
      left: 50%;
      bottom: -5%;
      width: min(67%, 320px);
      transform: translateX(-50%);
      filter: drop-shadow(0 14px 12px rgba(35,8,87,.3));
    }

    .splash-actions {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: 72px 1fr 72px;
      align-items: end;
      gap: 16px;
      margin-bottom: 8px;
    }

    .splash-play-button {
      justify-self: center;
      width: 112px;
      min-width: 112px;
      height: 112px;
      min-height: 112px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: radial-gradient(circle at 34% 24%, #92ef69 0 13%, #55c83a 14% 62%, #299b29 63% 100%);
      border: 6px solid #fff;
      border-radius: 50%;
      box-shadow: 0 10px 0 #23812a, 0 16px 25px rgba(25,8,73,.35);
    }

    .splash-play-button::before {
      content: "";
      width: 0;
      height: 0;
      margin-left: 9px;
      border-top: 24px solid transparent;
      border-bottom: 24px solid transparent;
      border-left: 36px solid #fff;
      filter: drop-shadow(0 3px 0 rgba(35,112,36,.4));
    }

    .splash-small-button {
      width: 72px;
      min-width: 72px;
      height: 72px;
      min-height: 72px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #fff;
      border: 4px solid rgba(255,255,255,.72);
      border-radius: 50%;
      font-size: 2rem;
      text-shadow: 0 3px 0 rgba(60,27,109,.6);
    }

    .splash-small-button.gift { background: linear-gradient(#ffd647, #f19d0f); }
    .splash-small-button.skin { background: linear-gradient(#47bfff, #3475e4); }

    .splash-toast {
      position: absolute;
      left: 50%;
      bottom: 142px;
      z-index: 8;
      max-width: calc(100% - 36px);
      padding: 9px 15px;
      color: #532596;
      background: #fff;
      border: 3px solid #7040c5;
      border-radius: 999px;
      box-shadow: 0 6px 0 rgba(46,19,106,.55);
      font-weight: 900;
      text-align: center;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
    }

    .splash-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .splash-screen button:hover:not(:disabled) { filter: brightness(1.05); }
    .splash-screen button:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 3px 0 rgba(48,21,119,.55), 0 7px 12px rgba(28,8,78,.25);
    }

    .splash-play-button:active:not(:disabled) { transform: translateY(5px); }

    @media (max-height: 700px) {
      .splash-layout { min-height: 540px; }
      .splash-title { font-size: clamp(2.6rem, 10vh, 4.2rem); }
      .splash-brand { margin-top: 3px; }
      .hero-character { width: min(75%, 360px); }
      .splash-toilet { width: min(53%, 255px); bottom: -10%; }
      .splash-play-button { width: 90px; min-width: 90px; height: 90px; min-height: 90px; }
      .splash-play-button::before { border-top-width: 19px; border-bottom-width: 19px; border-left-width: 29px; }
      .splash-small-button { width: 62px; min-width: 62px; height: 62px; min-height: 62px; }
      .splash-actions { grid-template-columns: 62px 1fr 62px; }
    }

  </style>
</head>

          <path d="M99 198c37 13 89 14 126 0" fill="none" stroke="#c1cbd6" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="splash-actions">
        <button id="giftButton" class="splash-small-button gift" type="button" aria-label="デイリーギフト">🎁</button>
        <button id="playButton" class="splash-play-button" type="button" aria-label="ゲームを始める"></button>
        <button id="skinButton" class="splash-small-button skin" type="button" aria-label="キャラクターの服を変える">👕</button>
      </div>

      <div id="splashToast" class="splash-toast" role="status" aria-live="polite"></div>
    </div>
  </section>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>トイレ・ルートチャレンジ</h1>
        <p>描いたルートに沿って、点々のおしっこが進みます。</p>
      </div>
      <div class="toolbar">
        <button id="homeButton" type="button">タイトル</button>
        <button id="stageButton" type="button">LEVEL選択</button>
        <button id="soundButton" type="button" aria-pressed="true">音：ON</button>
      </div>
    </header>

    <section class="hud" aria-label="ゲーム情報">
      <div class="hud-item"><div class="hud-label">LEVEL</div><div id="levelDisplay" class="hud-value">1 / 100</div></div>
      <div class="hud-item"><div class="hud-label">テーマ</div><div id="themeDisplay" class="hud-value">おうち</div></div>
      <div class="hud-item"><div class="hud-label">スター</div><div id="starsDisplay" class="hud-value">0 ★</div></div>
      <div class="hud-item"><div class="hud-label">チャレンジ</div><div id="triesDisplay" class="hud-value">0</div></div>
    </section>

    <div class="game-frame">
      <canvas id="gameCanvas" width="720" height="900" aria-label="線を描いてトイレへおしっこを届けるゲーム"></canvas>
    </div>

    <div id="message" class="message" aria-live="polite">青い丸から便器の中まで、指やマウスでルートを描こう！</div>

    <div class="bottom-controls">
      <button id="retryButton" type="button">やり直す</button>
      <button id="hintButton" type="button">ヒント</button>
      <button id="startButton" class="primary" type="button">描いた道で発射</button>
    </div>

    <p class="instructions">青い発射点からドラッグして道を描きます。障害物に触れないよう、便器の穴までつなげてください。離すと自動発射、または「描いた道で発射」を押します。</p>
  </main>

  <dialog id="stageDialog">
    <div class="dialog-inner">
      <div class="dialog-head">
        <div>
          <h2>LEVEL SELECT</h2>
          <div class="brand"><p>クリアすると次のLEVELが開きます。</p></div>
        </div>
        <button id="closeStageButton" class="close" type="button" aria-label="閉じる">×</button>
      </div>
      <div id="stageGrid" class="stage-grid"></div>
    </div>
  </dialog>

  <dialog id="resultDialog">
    <div class="dialog-inner result">
      <div id="resultFace" class="result-face">😄</div>
      <h2 id="resultTitle">LEVEL CLEAR!</h2>
      <div id="resultStars" class="big-stars">★★★</div>
      <p id="resultText">きれいに便器へ入りました。</p>
      <div class="result-actions">
        <button id="resultRetryButton" type="button">もう一度</button>
        <button id="nextButton" class="primary" type="button">次のLEVEL</button>
      </div>
    </div>
  </dialog>

  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const ui = {
      level: document.getElementById("levelDisplay"),
      theme: document.getElementById("themeDisplay"),
      stars: document.getElementById("starsDisplay"),
      tries: document.getElementById("triesDisplay"),
      message: document.getElementById("message"),
      stageDialog: document.getElementById("stageDialog"),
      stageGrid: document.getElementById("stageGrid"),
      resultDialog: document.getElementById("resultDialog"),
      resultFace: document.getElementById("resultFace"),
      resultTitle: document.getElementById("resultTitle"),
      resultStars: document.getElementById("resultStars"),
      resultText: document.getElementById("resultText"),
      next: document.getElementById("nextButton"),
      start: document.getElementById("startButton"),
      sound: document.getElementById("soundButton")
    };

    const themes = [
      { name: "おうち", sky: "#fff8dc", floor: "#d1b38d", wall: "#f3dfb8", brick: "#ddb98e", accent: "#74a8df", toilet: "#eaf4ff" },
      { name: "学校", sky: "#e7f4ff", floor: "#c3aa7a", wall: "#f9f3dd", brick: "#d5b57c", accent: "#4b8cbf", toilet: "#f7fbff" },
      { name: "公園", sky: "#dff6ff", floor: "#78b965", wall: "#afe08e", brick: "#8bba6b", accent: "#2d9b72", toilet: "#e9fbf2" },
      { name: "夜の街", sky: "#1e2446", floor: "#3c4056", wall: "#30385d", brick: "#596080", accent: "#ed79c5", toilet: "#dfe8ff" },
      { name: "工場", sky: "#dbe2e7", floor: "#737c84", wall: "#aab4bc", brick: "#7f8a93", accent: "#ef8c37", toilet: "#eef1f4" },
      { name: "ビーチ", sky: "#ccefff", floor: "#efd18d", wall: "#ffeba8", brick: "#d9a963", accent: "#1d9fc1", toilet: "#f5ffff" },
      { name: "お城", sky: "#e9e2ff", floor: "#8c789d", wall: "#c9b7d8", brick: "#9f89ad", accent: "#9b62c8", toilet: "#fff1cf" },
      { name: "雪国", sky: "#eaf8ff", floor: "#b9dcea", wall: "#d9f2fb", brick: "#9fc8d8", accent: "#4da2ca", toilet: "#ffffff" },
      { name: "宇宙", sky: "#111633", floor: "#535879", wall: "#2a315f", brick: "#69709d", accent: "#54d5d0", toilet: "#d9f6ff" },
      { name: "ゴールド", sky: "#fff1b8", floor: "#9d6d2b", wall: "#e0b252", brick: "#b68031", accent: "#b46616", toilet: "#ffd75d" }
    ];

    function rng(seed) {
      let value = seed >>> 0;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    function rect(x, y, w, h, kind = "wall", moving = null) {
      return { shape: "rect", x, y, w, h, kind, moving };
    }

    function circle(x, y, r, kind = "fan", moving = null) {
      return { shape: "circle", x, y, r, kind, moving };
    }

    function makeStage(number) {
      const zone = Math.floor((number - 1) / 10);
      const index = (number - 1) % 10;
      const random = rng(number * 9173 + 41);
      const mirror = number % 6 === 0 || number % 11 === 0;
      const startX = mirror ? 615 : 105;
      const toiletX = mirror ? 105 : 615;
      const startY = 760 - Math.floor(random() * 3) * 45;
      const toiletY = 750 - Math.floor(random() * 3) * 45;
      const obstacles = [];
      const lo = 190;
      const hi = 535;
      const wallX = 310 + Math.floor((random() - .5) * 70);

      if (index === 1) {
        obstacles.push(rect(wallX, 515, 48, 245, "wall"));
      } else if (index === 2) {
        obstacles.push(rect(245, 565, 48, 195, "wall"));
        obstacles.push(rect(455, 350, 48, 230, "wall"));
      } else if (index === 3) {
        obstacles.push(rect(250, 210, 235, 115, "ceiling"));
        obstacles.push(rect(250, 610, 235, 150, "wall"));
      } else if (index === 4) {
        obstacles.push(rect(300, 665, 120, 95, "spikes"));
        obstacles.push(circle(360, 490, 45, "fan"));
      } else if (index === 5) {
        obstacles.push(rect(wallX, 420, 50, 250, "gate", { axis: "y", range: 150, speed: .0014 + zone * .00006, phase: number }));
      } else if (index === 6) {
        obstacles.push(rect(215, 545, 46, 215, "wall"));
        obstacles.push(rect(350, 225, 46, 245, "wall"));
        obstacles.push(rect(495, 560, 46, 200, "wall"));
      } else if (index === 7) {
        obstacles.push(circle(300, 470, 48, "fan", { axis: "y", range: 115, speed: .0017, phase: number }));
        obstacles.push(circle(470, 470, 48, "fan", { axis: "y", range: 115, speed: .0017, phase: number + 3 }));
      } else if (index === 8) {
        obstacles.push(rect(215, 270, 300, 100, "ceiling"));
        obstacles.push(rect(215, 590, 300, 170, "wall"));
        obstacles.push(rect(350, 445, 42, 65, "spikes"));
      } else if (index === 9) {
        obstacles.push(rect(205, 560, 45, 200, "spikes"));
        obstacles.push(rect(350, 265, 45, 230, "gate", { axis: "y", range: 120, speed: .0018, phase: number }));
        obstacles.push(circle(505, 500, 44, "fan", { axis: "x", range: 85, speed: .0015, phase: number + 2 }));
      }

      if (zone >= 3 && index > 0 && index < 9 && random() > .45) {
        obstacles.push(circle(lo + random() * (hi - lo), 350 + random() * 180, 28 + random() * 12, "bubble"));
      }

      if (mirror) {
        for (const o of obstacles) {
          if (o.shape === "rect") o.x = W - o.x - o.w;
          else o.x = W - o.x;
        }
      }

      const direct = Math.hypot(toiletX - startX, (toiletY - 80) - (startY - 84));
      return {
        number,
        zone,
        theme: themes[zone],
        mirror,
        start: { x: startX, y: startY },
        toilet: { x: toiletX, y: toiletY },
        obstacles,
        maxLength: direct * (1.55 + zone * .035 + index * .018),
        streamSpeed: Math.max(74, 108 - zone * 2.8),
        dropletCount: 13 + Math.floor(zone / 2),
        hint: index === 0 ? "まっすぐ便器の穴へつなごう。" :
              index === 1 ? "壁の上を大きく回り込もう。" :
              index === 2 ? "2本の壁の間をS字に通ろう。" :
              index === 3 ? "上下の障害物の間を通ろう。" :
              index === 4 ? "トゲと回転物に触れない道を描こう。" :
              index === 5 ? "動く壁が離れた瞬間を狙おう。" :
              index === 6 ? "ジグザグに抜ける道を探そう。" :
              index === 7 ? "動く丸の間を通るタイミングが大切。" :
              index === 8 ? "細い通路をていねいに通そう。" :
              "動く障害物をよく見て、長すぎない道を描こう。"
      };
    }

    const stages = Array.from({ length: 100 }, (_, i) => makeStage(i + 1));

    let currentLevel = 0;
    let unlocked = 1;
    let bestStars = Array(100).fill(0);
    let totalTries = 0;
    let levelTries = 0;
    let soundOn = true;
    let audioContext = null;

    try {
      const saved = JSON.parse(localStorage.getItem("toiletRoute100Save") || "null");
      if (saved) {
        unlocked = Math.max(1, Math.min(100, Number(saved.unlocked) || 1));
        if (Array.isArray(saved.bestStars)) {
          bestStars = stages.map((_, i) => Math.max(0, Math.min(3, Number(saved.bestStars[i]) || 0)));
        }
      }
    } catch (_) {}

    let path = [];
    let pathLength = 0;
    let drawing = false;
    let running = false;
    let completed = false;
    let state = "idle";
    let hintVisible = false;
    let particles = [];
    let droplets = [];
    let streamTime = 0;
    let resultTimer = 0;
    let lastTime = performance.now();
    let currentDynamicObstacles = [];

    function save() {
      try {
        localStorage.setItem("toiletRoute100Save", JSON.stringify({ unlocked, bestStars }));
      } catch (_) {}
    }

    function totalStars() {
      return bestStars.reduce((sum, value) => sum + value, 0);
    }

    function setMessage(text, type = "") {
      ui.message.textContent = text;
      ui.message.className = "message" + (type ? " " + type : "");
    }

    function tone(freq, duration = .08, type = "sine", gainValue = .035) {
      if (!soundOn) return;
      try {
        audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.value = freq;
        gain.gain.value = gainValue;
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start();
        gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + duration);
        oscillator.stop(audioContext.currentTime + duration);
      } catch (_) {}
    }

    function originFor(stage) {
      const direction = stage.mirror ? -1 : 1;
      return { x: stage.start.x + direction * 24, y: stage.start.y - 82 };
    }

    function targetFor(stage) {
      return { x: stage.toilet.x, y: stage.toilet.y - 91 };
    }

    function updateHud() {
      const stage = stages[currentLevel];
      ui.level.textContent = `${currentLevel + 1} / 100`;
      ui.theme.textContent = stage.theme.name;
      ui.stars.textContent = `${totalStars()} ★`;
      ui.tries.textContent = String(levelTries);
    }

    function resetLevel(showMessage = true) {
      path = [];
      pathLength = 0;
      drawing = false;
      running = false;
      completed = false;
      state = "idle";
      hintVisible = false;
      particles = [];
      droplets = [];
      streamTime = 0;
      resultTimer = 0;
      ui.start.disabled = false;
      if (showMessage) setMessage("青い丸から便器の中まで、指やマウスでルートを描こう！");
      updateHud();
    }

    function loadLevel(index) {
      currentLevel = Math.max(0, Math.min(stages.length - 1, index));
      levelTries = 0;
      resetLevel();
      renderStageButtons();
    }

    function canvasPoint(event) {
      const rectBox = canvas.getBoundingClientRect();
      const source = event.touches ? event.touches[0] : event;
      return {
        x: (source.clientX - rectBox.left) * W / rectBox.width,
        y: (source.clientY - rectBox.top) * H / rectBox.height
      };
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function addPathPoint(point) {
      const previous = path[path.length - 1];
      if (!previous) return;
      const segment = distance(previous, point);
      if (segment < 7) return;
      const stage = stages[currentLevel];
      if (pathLength + segment > stage.maxLength) {
        setMessage("道が長すぎます。もっと短いルートにしよう！", "fail");
        tone(165, .08, "square", .025);
        return;
      }
      const clamped = {
        x: Math.max(16, Math.min(W - 16, point.x)),
        y: Math.max(92, Math.min(H - 28, point.y))
      };
      path.push(clamped);
      pathLength += segment;
    }

    function beginDraw(event) {
      if (running || completed) return;
      const point = canvasPoint(event);
      const origin = originFor(stages[currentLevel]);
      if (distance(point, origin) > 62) {
        setMessage("まず青い発射点から描き始めてください。", "fail");
        return;
      }
      event.preventDefault();
      path = [origin];
      pathLength = 0;
      drawing = true;
      state = "focus";
      hintVisible = false;
      setMessage("そのまま便器の穴までルートを描こう！");
      if (canvas.setPointerCapture && event.pointerId !== undefined) canvas.setPointerCapture(event.pointerId);
    }

    function moveDraw(event) {
      if (!drawing || running) return;
      event.preventDefault();
      addPathPoint(canvasPoint(event));
    }

    function endDraw(event) {
      if (!drawing) return;
      event.preventDefault();
      drawing = false;
      state = "idle";
      const target = targetFor(stages[currentLevel]);
      const last = path[path.length - 1];
      if (!last || path.length < 3) {
        setMessage("ルートが短すぎます。もう一度描こう。", "fail");
        return;
      }
      if (distance(last, target) <= 75) {
        path.push(target);
        pathLength += distance(last, target);
        startStream();
      } else {
        setMessage("最後を便器の穴までつなげよう。", "fail");
      }
    }

    function buildPathMetrics() {
      const segments = [];
      let total = 0;
      for (let i = 1; i < path.length; i++) {
        const length = distance(path[i - 1], path[i]);
        segments.push({ a: path[i - 1], b: path[i], start: total, length });
        total += length;
      }
      return { segments, total };
    }

    function pointAtDistance(metrics, d) {
      if (!metrics.segments.length) return path[0] || { x: 0, y: 0 };
      const clamped = Math.max(0, Math.min(metrics.total, d));
      for (const segment of metrics.segments) {
        if (clamped <= segment.start + segment.length) {
          const t = segment.length ? (clamped - segment.start) / segment.length : 0;
          return {
            x: segment.a.x + (segment.b.x - segment.a.x) * t,
            y: segment.a.y + (segment.b.y - segment.a.y) * t
          };
        }
      }
      return metrics.segments[metrics.segments.length - 1].b;
    }

    function startStream() {
      if (running || path.length < 3) return;
      const stage = stages[currentLevel];
      const target = targetFor(stage);
      const end = path[path.length - 1];
      if (distance(end, target) > 80) {
        setMessage("便器の穴まで道をつなげてください。", "fail");
        return;
      }

      levelTries += 1;
      totalTries += 1;
      updateHud();
      running = true;
      state = "strain";
      streamTime = 0;
      resultTimer = 0;
      droplets = [];
      particles = [];
      ui.start.disabled = true;
      const metrics = buildPathMetrics();
      for (let i = 0; i < stage.dropletCount; i++) {
        droplets.push({
          offset: i * 72,
          distance: -i * 18,
          alive: true,
          hit: false,
          done: false,
          x: path[0].x,
          y: path[0].y,
          metrics
        });
      }
      setMessage("点々のおしっこが進んでいます……");
      tone(420, .08, "sine", .022);
    }

    function dynamicObstacle(obstacle, now) {
      let x = obstacle.x;
      let y = obstacle.y;
      if (obstacle.moving) {
        const wave = Math.sin(now * obstacle.moving.speed + obstacle.moving.phase);
        if (obstacle.moving.axis === "x") x += wave * obstacle.moving.range;
        else y += wave * obstacle.moving.range;
      }
      return { ...obstacle, x, y };
    }

    function pointHitsObstacle(point, obstacle) {
      const padding = 5;
      if (obstacle.shape === "rect") {
        return point.x >= obstacle.x - padding &&
          point.x <= obstacle.x + obstacle.w + padding &&
          point.y >= obstacle.y - padding &&
          point.y <= obstacle.y + obstacle.h + padding;
      }
      return Math.hypot(point.x - obstacle.x, point.y - obstacle.y) <= obstacle.r + padding;
    }

    function spawnSplash(x, y, success) {
      const amount = success ? 12 : 8;
      for (let i = 0; i < amount; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - .5) * 4.6,
          vy: -1.5 - Math.random() * 4,
          life: 34 + Math.random() * 22,
          success
        });
      }
    }

    function evaluateStream() {
      if (!running || completed) return;
      const stage = stages[currentLevel];
      const successful = droplets.filter(d => d.hit).length;
      const required = Math.ceil(stage.dropletCount * .7);
      running = false;
      ui.start.disabled = false;

      if (successful >= required) {
        completed = true;
        state = "happy";
        const efficiency = pathLength / stage.maxLength;
        const stars = levelTries === 1 && efficiency < .72 ? 3 : levelTries <= 2 && efficiency < .9 ? 2 : 1;
        bestStars[currentLevel] = Math.max(bestStars[currentLevel], stars);
        unlocked = Math.max(unlocked, Math.min(100, currentLevel + 2));
        save();
        updateHud();
        setMessage(`成功！ ${successful}個の点が便器に入りました！`, "success");
        tone(660, .09, "sine", .04);
        setTimeout(() => tone(880, .15, "sine", .04), 95);
        setTimeout(() => showResult(stars, successful), 520);
      } else {
        state = "cry";
        setMessage("失敗！ 障害物を避ける別の道を描こう。", "fail");
        tone(145, .2, "sawtooth", .025);
      }
    }

    function update(dt, now) {
      currentDynamicObstacles = stages[currentLevel].obstacles.map(o => dynamicObstacle(o, now));

      if (running) {
        const stage = stages[currentLevel];
        let allDone = true;
        for (const drop of droplets) {
          if (drop.done) continue;
          allDone = false;
          drop.distance += stage.streamSpeed * dt;
          if (drop.distance < 0) continue;
          const point = pointAtDistance(drop.metrics, drop.distance);
          drop.x = point.x;
          drop.y = point.y;

          const collision = currentDynamicObstacles.some(o => pointHitsObstacle(point, o));
          if (collision) {
            drop.done = true;
            drop.alive = false;
            spawnSplash(point.x, point.y, false);
            continue;
          }

          if (drop.distance >= drop.metrics.total) {
            drop.done = true;
            const target = targetFor(stage);
            if (distance(point, target) <= 40) {
              drop.hit = true;
              spawnSplash(target.x, target.y + 4, true);
              tone(530 + Math.random() * 60, .035, "sine", .009);
            } else {
              drop.alive = false;
              spawnSplash(point.x, point.y, false);
            }
          }
        }
        if (allDone || droplets.every(d => d.done)) evaluateStream();
      }

      for (const p of particles) {
        p.vy += .12;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
      }
      particles = particles.filter(p => p.life > 0);
    }

    function roundedRect(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawBackground(stage) {
      const t = stage.theme;
      ctx.fillStyle = t.sky;
      ctx.fillRect(0, 0, W, H);

      if (stage.zone === 2 || stage.zone === 5) {
        ctx.fillStyle = "rgba(255,255,255,.72)";
        for (let i = 0; i < 5; i++) {
          const x = 70 + i * 155;
          const y = 120 + (i % 2) * 70;
          ctx.beginPath();
          ctx.arc(x, y, 28, 0, Math.PI * 2);
          ctx.arc(x + 30, y + 3, 36, 0, Math.PI * 2);
          ctx.arc(x + 65, y, 25, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (stage.zone === 3 || stage.zone === 8) {
        ctx.fillStyle = "rgba(255,255,255,.75)";
        for (let i = 0; i < 36; i++) {
          const random = rng(i * 431 + stage.number);
          ctx.beginPath();
          ctx.arc(random() * W, 95 + random() * 480, 1 + random() * 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = "rgba(255,255,255,.18)";
        for (let y = 100; y < 720; y += 70) {
          for (let x = (y / 70) % 2 ? -30 : 10; x < W; x += 125) {
            ctx.fillRect(x, y, 88, 20);
          }
        }
      }

      ctx.fillStyle = t.floor;
      ctx.fillRect(0, 805, W, 95);
      ctx.fillStyle = "rgba(0,0,0,.08)";
      ctx.fillRect(0, 805, W, 7);

      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.strokeStyle = "rgba(34,34,34,.72)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      roundedRect(260, 18, 200, 58, 28);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#292929";
      ctx.font = "900 26px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(`LEVEL ${stage.number}`, 360, 57);
    }

    function drawPlatform(x, y, width, stage) {
      const left = x - width / 2;
      ctx.fillStyle = stage.theme.brick;
      ctx.strokeStyle = "#3d352c";
      ctx.lineWidth = 3;
      ctx.beginPath();
      roundedRect(left, y, width, 74, 5);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "rgba(60,45,32,.35)";
      ctx.lineWidth = 2;
      for (let row = 0; row < 3; row++) {
        const yy = y + 22 + row * 21;
        ctx.beginPath();
        ctx.moveTo(left, yy);
        ctx.lineTo(left + width, yy);
        ctx.stroke();
        const offset = row % 2 ? 24 : 4;
        for (let xx = left + offset; xx < left + width; xx += 55) {
          ctx.beginPath();
          ctx.moveTo(xx, yy - 21);
          ctx.lineTo(xx, yy);
          ctx.stroke();
        }
      }
    }

    function drawFace(x, y, expression, mirror) {
      ctx.save();
      ctx.translate(x, y);
      if (mirror) ctx.scale(-1, 1);
      ctx.strokeStyle = "#202020";
      ctx.fillStyle = "#fffdf7";
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.arc(0, 0, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      const eyeY = -7;
      if (expression === "happy") {
        ctx.beginPath();
        ctx.arc(-12, eyeY, 7, Math.PI, 0);
        ctx.arc(12, eyeY, 7, Math.PI, 0);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 5, 17, .15, Math.PI - .15);
        ctx.stroke();
      } else if (expression === "cry") {
        ctx.beginPath();
        ctx.moveTo(-19, -11); ctx.lineTo(-6, -5);
        ctx.moveTo(19, -11); ctx.lineTo(6, -5);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 16, 12, Math.PI + .15, Math.PI * 2 - .15);
        ctx.stroke();
        ctx.fillStyle = "#54a9e8";
        ctx.beginPath(); ctx.ellipse(-15, 14, 4, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(15, 14, 4, 11, 0, 0, Math.PI * 2); ctx.fill();
      } else if (expression === "strain") {
        ctx.beginPath();
        ctx.moveTo(-19, -12); ctx.lineTo(-5, -6);
        ctx.moveTo(19, -12); ctx.lineTo(5, -6);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(0, 12, 9, 13, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else if (expression === "focus") {
        ctx.beginPath();
        ctx.moveTo(-20, -12); ctx.lineTo(-6, -8);
        ctx.moveTo(20, -12); ctx.lineTo(6, -8);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(-11, -4, 3, 0, Math.PI * 2); ctx.fillStyle = "#202020"; ctx.fill();
        ctx.beginPath(); ctx.arc(11, -4, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-9, 14); ctx.lineTo(9, 14); ctx.stroke();
      } else {
        ctx.fillStyle = "#202020";
        ctx.beginPath(); ctx.arc(-11, -5, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(11, -5, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 18, 12, Math.PI + .2, Math.PI * 2 - .2); ctx.stroke();
        ctx.fillStyle = "#63b6ea";
        ctx.beginPath(); ctx.ellipse(mirror ? -37 : 37, -4, 5, 11, -.2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function drawCharacter(stage) {
      const x = stage.start.x;
      const y = stage.start.y;
      const direction = stage.mirror ? -1 : 1;
      const expression = state;

      ctx.save();
      ctx.strokeStyle = "#202020";
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      drawFace(x, y - 190, expression, stage.mirror);

      ctx.beginPath();
      ctx.moveTo(x, y - 155);
      ctx.lineTo(x, y - 78);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x, y - 135);
      ctx.lineTo(x + direction * 35, y - 102);
      ctx.moveTo(x, y - 135);
      ctx.lineTo(x - direction * 24, y - 102);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x, y - 78);
      ctx.lineTo(x - 30, y - 8);
      ctx.moveTo(x, y - 78);
      ctx.lineTo(x + 32, y - 8);
      ctx.stroke();

      ctx.fillStyle = stage.theme.accent;
      ctx.beginPath();
      ctx.moveTo(x - 17, y - 103);
      ctx.lineTo(x + 17, y - 103);
      ctx.lineTo(x + 13, y - 72);
      ctx.lineTo(x - 13, y - 72);
      ctx.closePath();
      ctx.fill();

      const origin = originFor(stage);
      ctx.fillStyle = "#38a7ed";
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawToilet(stage) {
      const x = stage.toilet.x;
      const y = stage.toilet.y;
      const facing = stage.mirror ? -1 : 1;
      const color = stage.theme.toilet;

      ctx.save();
      ctx.translate(x, y);
      if (stage.mirror) ctx.scale(-1, 1);
      ctx.strokeStyle = "#36404a";
      ctx.lineWidth = 4;
      ctx.fillStyle = color;

      ctx.beginPath();
      roundedRect(-6, -164, 75, 84, 12);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-2, -83, 67, 23, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#a9dff1";
      ctx.beginPath();
      ctx.ellipse(-4, -86, 46, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-46, -70);
      ctx.quadraticCurveTo(-38, -8, -14, 0);
      ctx.lineTo(42, 0);
      ctx.quadraticCurveTo(40, -42, 30, -72);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      if (stage.zone === 9) {
        ctx.fillStyle = "#d5861d";
        ctx.beginPath();
        ctx.arc(30, -145, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();

      const target = targetFor(stage);
      ctx.save();
      ctx.strokeStyle = "rgba(56,167,237,.9)";
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 7]);
      ctx.beginPath();
      ctx.arc(target.x, target.y, 35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawObstacle(o, stage, now) {
      ctx.save();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#343434";

      if (o.shape === "rect") {
        if (o.kind === "spikes") {
          ctx.fillStyle = "#d85a50";
          const count = Math.max(2, Math.floor(o.w / 24));
          const step = o.w / count;
          for (let i = 0; i < count; i++) {
            ctx.beginPath();
            ctx.moveTo(o.x + i * step, o.y + o.h);
            ctx.lineTo(o.x + i * step + step / 2, o.y);
            ctx.lineTo(o.x + (i + 1) * step, o.y + o.h);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        } else {
          ctx.fillStyle = o.kind === "gate" ? stage.theme.accent : stage.theme.wall;
          ctx.beginPath();
          roundedRect(o.x, o.y, o.w, o.h, 6);
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255,.35)";
          ctx.lineWidth = 3;
          for (let yy = o.y + 18; yy < o.y + o.h; yy += 28) {
            ctx.beginPath();
            ctx.moveTo(o.x + 7, yy);
            ctx.lineTo(o.x + o.w - 7, yy);
            ctx.stroke();
          }
        }
      } else {
        if (o.kind === "bubble") {
          ctx.fillStyle = "rgba(92,185,220,.45)";
          ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,.65)";
          ctx.beginPath(); ctx.arc(o.x - o.r * .3, o.y - o.r * .3, o.r * .18, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = "#e85b5b";
          ctx.beginPath(); ctx.arc(o.x, o.y, o.r * .34, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.translate(o.x, o.y);
          ctx.rotate(now * .0022);
          for (let i = 0; i < 6; i++) {
            ctx.rotate(Math.PI / 3);
            ctx.fillStyle = i % 2 ? "#f7b846" : "#ef6f5e";
            ctx.beginPath();
            ctx.moveTo(o.r * .2, -8);
            ctx.lineTo(o.r, -17);
            ctx.lineTo(o.r, 17);
            ctx.lineTo(o.r * .2, 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    function drawPath(stage) {
      if (hintVisible && path.length === 0) {
        const start = originFor(stage);
        const target = targetFor(stage);
        ctx.save();
        ctx.strokeStyle = "rgba(107,85,217,.45)";
        ctx.lineWidth = 5;
        ctx.setLineDash([5, 13]);
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        const midX = (start.x + target.x) / 2;
        const topY = Math.min(start.y, target.y) - 230;
        ctx.quadraticCurveTo(midX, topY, target.x, target.y);
        ctx.stroke();
        ctx.restore();
      }

      if (path.length < 2) return;
      ctx.save();
      ctx.strokeStyle = running ? "rgba(112,91,55,.25)" : "rgba(45,45,45,.72)";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.setLineDash([3, 14]);
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);
      for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
      ctx.stroke();
      ctx.restore();
    }

    function drawDroplets() {
      ctx.save();
      ctx.fillStyle = "#f2bf21";
      ctx.strokeStyle = "rgba(148,99,0,.35)";
      ctx.lineWidth = 1.5;
      for (const d of droplets) {
        if (!d.done && d.distance >= 0) {
          ctx.beginPath();
          ctx.arc(d.x, d.y, 7.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      }
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 35));
        ctx.fillStyle = p.success ? "#f2bf21" : "#d9a91b";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawLengthMeter(stage) {
      const ratio = Math.min(1, pathLength / stage.maxLength);
      const x = 24;
      const y = 98;
      const width = 175;
      ctx.fillStyle = "rgba(255,255,255,.88)";
      ctx.strokeStyle = "rgba(34,34,34,.55)";
      ctx.lineWidth = 2;
      ctx.beginPath(); roundedRect(x, y, width, 30, 15); ctx.fill(); ctx.stroke();
      ctx.fillStyle = ratio > .9 ? "#dc5858" : "#6b55d9";
      ctx.beginPath(); roundedRect(x + 4, y + 4, Math.max(0, (width - 8) * ratio), 22, 11); ctx.fill();
      ctx.fillStyle = "#252525";
      ctx.font = "800 13px system-ui";
      ctx.textAlign = "left";
      ctx.fillText("ルートの長さ", x + 8, y + 21);
    }

    function draw(now) {
      const stage = stages[currentLevel];
      drawBackground(stage);
      drawPlatform(stage.start.x, stage.start.y + 2, 170, stage);
      drawPlatform(stage.toilet.x, stage.toilet.y + 2, 185, stage);
      for (const obstacle of currentDynamicObstacles) drawObstacle(obstacle, stage, now);
      drawPath(stage);
      drawCharacter(stage);
      drawToilet(stage);
      drawDroplets();
      drawLengthMeter(stage);

      if (hintVisible) {
        ctx.fillStyle = "rgba(255,255,255,.92)";
        ctx.strokeStyle = "rgba(34,34,34,.5)";
        ctx.lineWidth = 2;
        ctx.beginPath(); roundedRect(200, 100, 490, 50, 15); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#333";
        ctx.font = "800 16px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(stage.hint, 445, 131);
      }
    }

    function loop(now) {
      const dt = Math.min(.033, (now - lastTime) / 1000);
      lastTime = now;
      update(dt, now);
      draw(now);
      requestAnimationFrame(loop);
    }

    function renderStageButtons() {
      ui.stageGrid.textContent = "";
      stages.forEach((stage, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "stage-button" + (index === currentLevel ? " current" : "");
        button.disabled = index + 1 > unlocked;
        const stars = bestStars[index];
        button.innerHTML = `<span class="stage-number">${index + 1}</span><span class="stage-stars">${stars ? "★".repeat(stars) + "☆".repeat(3 - stars) : index + 1 > unlocked ? "🔒" : "☆☆☆"}</span>`;
        button.addEventListener("click", () => {
          loadLevel(index);
          ui.stageDialog.close();
        });
        ui.stageGrid.appendChild(button);
      });
    }

    function showResult(stars, hits) {
      ui.resultFace.textContent = stars === 3 ? "🤩" : stars === 2 ? "😄" : "🙂";
      ui.resultTitle.textContent = "LEVEL CLEAR!";
      ui.resultStars.textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
      ui.resultText.textContent = `${hits}個の点が入りました。チャレンジ回数：${levelTries}`;
      ui.next.textContent = currentLevel === 99 ? "LEVEL選択" : "次のLEVEL";
      ui.resultDialog.showModal();
    }

    canvas.addEventListener("pointerdown", beginDraw);
    canvas.addEventListener("pointermove", moveDraw);
    canvas.addEventListener("pointerup", endDraw);
    canvas.addEventListener("pointercancel", endDraw);

    document.getElementById("retryButton").addEventListener("click", () => resetLevel());
    document.getElementById("hintButton").addEventListener("click", () => {
      if (running) return;
      hintVisible = !hintVisible;
      setMessage(hintVisible ? stages[currentLevel].hint : "青い丸から便器の中までルートを描こう！");
    });
    ui.start.addEventListener("click", startStream);

    document.getElementById("homeButton").addEventListener("click", () => {
      if (running) resetLevel();
      splash.hidden = false;
      document.body.classList.add("splash-open");
      window.scrollTo({ top: 0, behavior: "instant" });
    });

    document.getElementById("stageButton").addEventListener("click", () => {
      renderStageButtons();
      ui.stageDialog.showModal();
    });
    document.getElementById("closeStageButton").addEventListener("click", () => ui.stageDialog.close());

    ui.sound.addEventListener("click", () => {
      soundOn = !soundOn;
      ui.sound.textContent = `音：${soundOn ? "ON" : "OFF"}`;
      ui.sound.setAttribute("aria-pressed", String(soundOn));
      if (soundOn) tone(520, .07);
    });

    document.getElementById("resultRetryButton").addEventListener("click", () => {
      ui.resultDialog.close();
      resetLevel();
    });

    ui.next.addEventListener("click", () => {
      ui.resultDialog.close();
      if (currentLevel === 99) {
        renderStageButtons();
        ui.stageDialog.showModal();
      } else {
        loadLevel(currentLevel + 1);
      }
    });

    window.addEventListener("keydown", event => {
      if (event.key.toLowerCase() === "r") resetLevel();
      if (event.key === "Enter" && !running) startStream();
      if (event.key.toLowerCase() === "h") {
        hintVisible = !hintVisible;
        setMessage(hintVisible ? stages[currentLevel].hint : "青い丸から便器の中までルートを描こう！");
      }
    });



    // Opening-screen interactions.
    const splash = document.getElementById("splashScreen");
    const splashSound = document.getElementById("splashSoundButton");
    const splashToast = document.getElementById("splashToast");
    const coinCount = document.getElementById("coinCount");
    const shirtStops = document.querySelectorAll("#shirtGradient stop");
    const shirtColors = [
      ["#ffb43b", "#ea6825"],
      ["#51c8ff", "#2977dd"],
      ["#79df70", "#36a747"],
      ["#ff75ba", "#d9428d"],
      ["#efefef", "#9da6b2"]
    ];
    let shirtIndex = 0;
    let splashSoundOn = true;
    let splashCoins = 200;
    let toastTimer = 0;

    function showSplashToast(text) {
      splashToast.textContent = text;
      splashToast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => splashToast.classList.remove("show"), 1500);
    }

    document.getElementById("playButton").addEventListener("click", () => {
      splash.hidden = true;
      document.body.classList.remove("splash-open");
      window.scrollTo({ top: 0, behavior: "instant" });
      if (splashSoundOn) tone(620, .08);
      setMessage("青い丸から便器の中まで、指やマウスでルートを描こう！");
    });

    splashSound.addEventListener("click", () => {
      splashSoundOn = !splashSoundOn;
      soundOn = splashSoundOn;
      splashSound.textContent = splashSoundOn ? "🔊" : "🔇";
      splashSound.setAttribute("aria-pressed", String(splashSoundOn));
      ui.sound.textContent = `音：${soundOn ? "ON" : "OFF"}`;
      ui.sound.setAttribute("aria-pressed", String(soundOn));
      if (splashSoundOn) tone(520, .07);
    });

    document.getElementById("giftButton").addEventListener("click", () => {
      splashCoins += 50;
      coinCount.textContent = splashCoins;
      showSplashToast("デイリーギフト：50コイン獲得！");
      if (splashSoundOn) tone(760, .08);
    });

    document.getElementById("skinButton").addEventListener("click", () => {
      shirtIndex = (shirtIndex + 1) % shirtColors.length;
      shirtStops[0].setAttribute("stop-color", shirtColors[shirtIndex][0]);
      shirtStops[1].setAttribute("stop-color", shirtColors[shirtIndex][1]);
      showSplashToast("服の色を変更しました");
      if (splashSoundOn) tone(570, .06);
    });

    document.getElementById("noAdsButton").addEventListener("click", () => {
      showSplashToast("広告なしモードはデモ表示です");
      if (splashSoundOn) tone(440, .06);
    });

    currentDynamicObstacles = stages[0].obstacles.map(o => dynamicObstacle(o, performance.now()));
    renderStageButtons();
    resetLevel(false);
    setMessage("青い丸から便器の中まで、指やマウスでルートを描こう！");
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
