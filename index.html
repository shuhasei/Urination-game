<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNDERTALE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    .title-screen {
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #000;
      display: grid;
      place-items: center;
    }

    .title-screen img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      image-rendering: pixelated;
      user-select: none;
      pointer-events: none;
    }


    /* Spotify audio controller (kept off-screen so the title image stays unchanged) */
    #spotify-embed {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .music-hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 10;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: clamp(12px, 1.5vw, 16px);
      letter-spacing: 0.08em;
      text-shadow: 0 2px 4px #000;
      cursor: pointer;
      user-select: none;
      opacity: 0.9;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.45);
      padding: 8px 12px;
    }

    .music-hint:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }
  </style>
</head>

    const musicHint = document.getElementById("musicHint");

    let spotifyController = null;
    let isPlaying = false;
    let playRequested = false;

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      const element = document.getElementById("spotify-embed");
      const options = {
        width: "1",
        height: "1",
        uri: TRACK_URI
      };

      IFrameAPI.createController(element, options, (controller) => {

        controller.addListener("playback_update", (event) => {

          musicHint.textContent = isPlaying

        if (playRequested) {
          spotifyController.play();
        }
      });

      if (!spotifyController) {
        playRequested = true;
        musicHint.textContent = "音楽を読み込み中…";
        return;
      }

      if (isPlaying) {
        spotifyController.pause();
      } else {
        spotifyController.play();
      }
    }

    musicHint.addEventListener("click", toggleMusic);
  </script>

</body>
</html>
